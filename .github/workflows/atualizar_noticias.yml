name: Atualizacao Automatica de Noticias e Politica 24h

on:
  schedule:
    # Executa a cada 1 hora (no minuto 0) 24 horas por dia gratuitamente
    - cron: '0 * * * *'
  workflow_dispatch: # Permite que você clique em "Run workflow" no GitHub para atualizar manualmente a qualquer hora

jobs:
  atualizar-noticias:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permite que o robô salve os novos arquivos HTML e faça commit

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 beautifulsoup4

      - name: Executar Agente de Notícias Gerais (EBC / Agência Brasil)
        run: |
          python noticias/agente_noticias.py

      - name: Executar Agente de Política e Leis Oficiais
        run: |
          python conteudo/agente_politica.py

      - name: Salvar e Publicar alterações no site
        run: |
          git config --global user.name "Robô InfoCidadão [GitHub Action]"
          git config --global user.email "bot-noticias@infocidadao.com"
          git add -A
          # Só faz commit se houver notícias novas
          if git diff --staged --quiet; then
            echo "Nenhuma notícia nova neste ciclo."
          else
            git commit -m "chore(noticias): atualização automática de notícias [skip ci]"
            git push
            echo "Novas notícias publicadas com sucesso!"
          fi
