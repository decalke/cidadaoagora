version: '3.8'

services:
  infocidadao-web:
    build: .
    container_name: infocidadao
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # O volume garante que as notícias salvas fiquem salvas no notebook mesmo se reiniciar
      - ./noticias:/var/www/html/noticias
      - ./conteudo:/var/www/html/conteudo
      - ./politica:/var/www/html/politica
